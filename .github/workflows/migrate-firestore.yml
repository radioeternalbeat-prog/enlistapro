name: Migrate Firestore guests

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de ejecución'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read

jobs:
  migrate:
    name: Backup and migrate guests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Backup, migrate and verify guests
        env:
          FIREBASE_PROJECT_ID: en-lista-app-z1e6wt
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ "${{ inputs.mode }}" = "apply" ]; then
            npm run migrate:apply
          else
            npm run migrate:dry-run
          fi
